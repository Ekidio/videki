<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- VIDEKI app icon – same family as STEMEKI: bold italic word + skewed colour badge with "EKI" cut out.
       The badge bands are film strips (frames) instead of STEMEKI's waveforms. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232327"/>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#2b3a5c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2b3a5c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".05"/>
    </pattern>
    <!-- film frames inside one band -->
    <pattern id="frames" x="0" y="258" width="34" height="38" patternUnits="userSpaceOnUse">
      <rect x="3" y="6" width="28" height="26" rx="3" fill="#000" fill-opacity=".55"/>
    </pattern>
    <mask id="cut">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <text x="246" y="381" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
            font-size="132" font-weight="900" font-style="italic" letter-spacing="-2" fill="#000">EKI</text>
    </mask>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect width="512" height="512" rx="114" fill="url(#dots)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- "VID" -->
  <text x="252" y="212" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="150" font-weight="900" font-style="italic" letter-spacing="-3" fill="#fff">VID</text>

  <!-- skewed badge: white offset + 4 film bands, "EKI" cut out -->
  <g transform="translate(0 0) skewX(-14)">
    <rect x="200" y="270" width="272" height="152" fill="#fff"/>
  </g>
  <g mask="url(#cut)">
    <g transform="skewX(-14)">
      <rect x="190" y="258" width="272" height="38" fill="#ff5a4f"/>
      <rect x="190" y="296" width="272" height="38" fill="#f0952b"/>
      <rect x="190" y="334" width="272" height="38" fill="#4cc76e"/>
      <rect x="190" y="372" width="272" height="38" fill="#4e7fbf"/>
      <rect x="190" y="258" width="272" height="152" fill="url(#frames)"/>
    </g>
  </g>
</svg>
